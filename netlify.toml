[build]
  command = "bun install && bun run build && pip install -r requirements.txt && python manage.py collectstatic --noinput"
  publish = "staticfiles"

[build.environment]
  PYTHON_VERSION = "3.12"
  DJANGO_SETTINGS_MODULE = "eventMan.settings"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/static/*"
  to = "/staticfiles/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "/media/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/main"
  status = 200
